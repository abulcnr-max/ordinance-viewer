<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NJ Flood Ordinance Viewer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f5f7fa;
    color: #111827;
    min-height: 100vh;
  }

  /* ── Header ── */
  .header {
    background: linear-gradient(135deg, #1a3a5c 0%, #2563a8 100%);
    color: white;
    padding: 24px 32px;
  }
  .header h1 { font-size: 22px; font-weight: 600; margin-bottom: 4px; }
  .header p  { font-size: 13px; opacity: 0.8; }

  /* ── Layout ── */
  .layout { display: flex; min-height: calc(100vh - 80px); }

  /* ── Sidebar ── */
  .sidebar {
    width: 280px;
    min-width: 280px;
    background: white;
    border-right: 1px solid #e0e4ea;
    padding: 24px 20px;
  }
  .sidebar-title {
    font-size: 11px;
    font-weight: 600;
    color: #6b7280;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 6px;
    margin-top: 16px;
  }
  .sidebar-title:first-child { margin-top: 0; }
  select {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid #e0e4ea;
    border-radius: 6px;
    font-size: 13px;
    color: #111827;
    background: white;
    cursor: pointer;
    outline: none;
  }
  select:focus { border-color: #2563a8; }

  /* ── Main content ── */
  .main {
    flex: 1;
    padding: 28px 32px;
    overflow-y: auto;
  }
  .town-name {
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .town-meta {
    font-size: 13px;
    color: #6b7280;
    margin-bottom: 8px;
  }
  .flood-count {
    font-size: 14px;
    font-weight: 600;
    color: #1a3a5c;
    margin-bottom: 20px;
  }
  .divider { border: none; border-top: 1px solid #e5e7eb; margin: 16px 0; }

  /* ── Section card ── */
  .section-card {
    background: white;
    border: 1px solid #e0e4ea;
    border-left: 4px solid #2563a8;
    border-radius: 8px;
    padding: 18px 22px;
    margin-bottom: 12px;
  }
  .section-ref {
    display: inline-block;
    font-size: 12px;
    font-weight: 700;
    color: #2563a8;
    font-family: 'Courier New', monospace;
    background: #eff6ff;
    padding: 2px 8px;
    border-radius: 4px;
    margin-bottom: 8px;
  }
  .section-title {
    font-size: 16px;
    font-weight: 600;
    color: #111827;
    margin-bottom: 8px;
  }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .chapter-tag {
    font-size: 11px;
    background: #f0f4ff;
    color: #3730a3;
    border: 1px solid #c7d2fe;
    border-radius: 12px;
    padding: 3px 10px;
  }
  .page-tag {
    font-size: 11px;
    background: #f3f4f6;
    color: #4b5563;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 3px 10px;
  }
  .reason-tag {
    display: inline-block;
    font-size: 12px;
    color: #059669;
    background: #ecfdf5;
    border: 1px solid #d1fae5;
    border-radius: 4px;
    padding: 4px 10px;
    margin-top: 4px;
  }

  /* ── Expander ── */
  .expander { margin-top: 10px; }
  .expander-btn {
    background: none;
    border: 1px solid #e0e4ea;
    border-radius: 6px;
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 600;
    color: #2563a8;
    cursor: pointer;
    width: 100%;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .expander-btn:hover { background: #f0f4ff; }
  .expander-content {
    display: none;
    margin-top: 8px;
    background: #f9fafb;
    border: 1px solid #e5e7eb;
    border-radius: 6px;
    padding: 14px 16px;
    font-size: 13px;
    line-height: 1.8;
    color: #374151;
    font-family: Georgia, serif;
    white-space: pre-wrap;
    word-wrap: break-word;
    max-height: 500px;
    overflow-y: auto;
  }
  .expander-content.open { display: block; }

  /* ── Loading / states ── */
  .loading {
    display: flex;
    align-items: center;
    gap: 10px;
    color: #6b7280;
    font-size: 14px;
    padding: 40px 0;
  }
  .spinner {
    width: 20px; height: 20px;
    border: 2px solid #e0e4ea;
    border-top-color: #2563a8;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .no-results {
    background: white;
    border: 1px dashed #d1d5db;
    border-radius: 10px;
    padding: 48px;
    text-align: center;
    color: #9ca3af;
    font-size: 15px;
  }
  .error-msg {
    background: #fef2f2;
    border: 1px solid #fecaca;
    border-radius: 8px;
    padding: 16px 20px;
    color: #dc2626;
    font-size: 14px;
    margin-bottom: 16px;
  }
  .progress-bar {
    width: 100%;
    height: 4px;
    background: #e0e4ea;
    border-radius: 2px;
    margin-top: 8px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: #2563a8;
    border-radius: 2px;
    transition: width 0.3s ease;
  }
  .footer {
    text-align: center;
    font-size: 12px;
    color: #9ca3af;
    padding: 20px;
    border-top: 1px solid #e5e7eb;
  }
</style>
</head>
<body>

<div class="header">
  <h1>🌊 NJ Flood Ordinance Viewer</h1>
  <p id="header-subtitle">Loading towns...</p>
</div>

<div class="layout">
  <div class="sidebar">
    <div class="sidebar-title">County</div>
    <select id="county-select" onchange="onCountyChange()" disabled>
      <option>Loading...</option>
    </select>

    <div class="sidebar-title">Town</div>
    <select id="town-select" onchange="onTownChange()" disabled>
      <option>Loading...</option>
    </select>
  </div>

  <div class="main" id="main-content">
    <div class="loading">
      <div class="spinner"></div>
      <div>
        <div id="loading-text">Loading ordinance data...</div>
        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill" style="width:0%"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const FOLDER_ID = "YOUR_FOLDER_ID_HERE";
const API_KEY   = "YOUR_API_KEY_HERE";

const DEFAULT_COUNTY = "Atlantic County";
const DEFAULT_TOWN   = "Town of Hammonton";

let countyTownMap = {};
let allData       = {};

async function listFiles(folderId) {
  let files = [], pageToken = null;
  do {
    let url = `https://www.googleapis.com/drive/v3/files?q=%27${folderId}%27+in+parents&fields=nextPageToken,files(id,name)&pageSize=1000&key=${API_KEY}`;
    if (pageToken) url += `&pageToken=${pageToken}`;
    const r    = await fetch(url);
    const data = await r.json();
    if (data.error) throw new Error(data.error.message);
    files      = files.concat(data.files || []);
    pageToken  = data.nextPageToken || null;
  } while (pageToken);
  return files.filter(f => f.name.endsWith(".json"));
}

async function downloadJSON(fileId) {
  const url  = `https://drive.google.com/uc?export=download&id=${fileId}`;
  const resp = await fetch(url);
  return resp.json();
}

async function loadAllTowns() {
  try {
    const files = await listFiles(FOLDER_ID);
    const total = files.length;
    let loaded  = 0;

    for (const file of files) {
      try {
        const data   = await downloadJSON(file.id);
        const town   = data.town   || file.name.replace(".json","");
        const county = data.county || "Unknown County";

        if (!countyTownMap[county]) countyTownMap[county] = [];
        countyTownMap[county].push({ town, id: file.id });
        allData[file.id] = data;

        loaded++;
        const pct = Math.round((loaded / total) * 100);
        document.getElementById("progress-fill").style.width = pct + "%";
        document.getElementById("loading-text").textContent = `Loading ${town}... (${loaded}/${total})`;
      } catch(e) { loaded++; }
    }

    // Sort towns within each county
    for (const county in countyTownMap) {
      countyTownMap[county].sort((a,b) => a.town.localeCompare(b.town));
    }

    buildSelects();
    document.getElementById("header-subtitle").textContent =
      `${Object.keys(countyTownMap).length} counties · ${Object.values(countyTownMap).reduce((s,a)=>s+a.length,0)} towns`;

  } catch(err) {
    document.getElementById("main-content").innerHTML =
      `<div class="error-msg">Failed to load data: ${err.message}</div>`;
  }
}

function buildSelects() {
  const countySelect = document.getElementById("county-select");
  const counties     = Object.keys(countyTownMap).sort();

  countySelect.innerHTML = "";
  counties.forEach(c => {
    const opt = document.createElement("option");
    opt.value = c; opt.textContent = c;
    countySelect.appendChild(opt);
  });

  // Default to Atlantic County
  const defaultIdx = counties.indexOf(DEFAULT_COUNTY);
  if (defaultIdx >= 0) countySelect.selectedIndex = defaultIdx;

  countySelect.disabled = false;
  onCountyChange();
}

function onCountyChange() {
  const county     = document.getElementById("county-select").value;
  const townSelect = document.getElementById("town-select");
  const towns      = countyTownMap[county] || [];

  townSelect.innerHTML = "";
  towns.forEach(t => {
    const opt = document.createElement("option");
    opt.value = t.id; opt.textContent = t.town;
    townSelect.appendChild(opt);
  });

  // Default to Hammonton if in Atlantic County
  if (county === DEFAULT_COUNTY) {
    const idx = towns.findIndex(t => t.town === DEFAULT_TOWN);
    if (idx >= 0) townSelect.selectedIndex = idx;
  }

  townSelect.disabled = false;
  onTownChange();
}

function onTownChange() {
  const fileId = document.getElementById("town-select").value;
  const data   = allData[fileId];
  if (!data) return;

  const county   = document.getElementById("county-select").value;
  const townName = document.getElementById("town-select").options[document.getElementById("town-select").selectedIndex].text;
  const sections = data.sections || [];

  const flood = sections
    .filter(s => s.flood_related === true && !s.is_toc_entry)
    .sort((a,b) => {
      const ma = a.section_ref.match(/(\d+)-(\d+)/);
      const mb = b.section_ref.match(/(\d+)-(\d+)/);
      if (!ma || !mb) return 0;
      return (parseInt(ma[1])*10000 + parseInt(ma[2])) - (parseInt(mb[1])*10000 + parseInt(mb[2]));
    });

  let html = `
    <div class="town-name">${esc(townName)}</div>
    <div class="town-meta">${esc(county)} &nbsp;·&nbsp; ${esc(data.pdf_name||'')} &nbsp;·&nbsp; ${data.total_pages||0} pages</div>
    <div class="flood-count">🌊 ${flood.length} flood-related sections found</div>
    <hr class="divider">
  `;

  if (!flood.length) {
    html += `<div class="no-results">No flood-related sections found for this town</div>`;
  } else {
    flood.forEach((sec, i) => {
      const ref     = esc(sec.section_ref    || "");
      const title   = esc(sec.section_title  || "");
      const chapter = esc(sec.chapter        || "");
      const reason  = esc(sec.classification_reason || "");
      const text    = esc(sec.full_text      || "");
      const ps      = sec.page_start || "?";
      const pe      = sec.page_end   || "?";

      html += `
        <div class="section-card">
          <div class="section-ref">${ref}</div>
          <div class="section-title">${title}</div>
          <div class="tags">
            <span class="chapter-tag">${chapter}</span>
            <span class="page-tag">pp. ${ps}–${pe}</span>
          </div>
          ${reason ? `<div class="reason-tag">✓ ${reason}</div>` : ""}
          <div class="expander">
            <button class="expander-btn" onclick="toggleExpander(${i})">
              📄 Read full text
            </button>
            <div class="expander-content" id="exp-${i}">${text}</div>
          </div>
        </div>
      `;
    });
  }

  html += `<div class="footer">Showing ${flood.length} flood-related sections · ${esc(townName)} · ${esc(county)}</div>`;
  document.getElementById("main-content").innerHTML = html;
}

function toggleExpander(i) {
  const el = document.getElementById("exp-" + i);
  el.classList.toggle("open");
}

function esc(str) {
  return String(str)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

loadAllTowns();
</script>
</body>
</html>
